spring:
  application:
    name: nanpo-window
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:nanpo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /api/docs
    operations-sorter: method
  api-docs:
    path: /api/openapi

app:
  ai:
    zhipu:
      api-key: ${ZHIPU_API_KEY:}
      text-model: ${ZHIPU_TEXT_MODEL:glm-4-flash-250414}
      vision-model: ${ZHIPU_VISION_MODEL:glm-4v-flash}
  auth:
    access-token-ttl: PT2H
    refresh-token-ttl: P30D
    local-account-password: ${LOCAL_ACCOUNT_PASSWORD:12345678}
  storage:
    type: ${STORAGE_TYPE:cos}
    local-root: ${APP_STORAGE_LOCAL_ROOT:${java.io.tmpdir}/nanpo-window-media}
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      secret-token: ${COS_SECRET_TOKEN:}
      region: ${COS_REGION:}
      bucket: ${COS_BUCKET:}
      upload-prefix: ${COS_UPLOAD_PREFIX:xiangjian-xicun/uploads}
      upload-url-ttl: ${COS_UPLOAD_URL_TTL:PT5M}
